services:
  hermes:
    build: .
    image: hermes-agent-financas:latest
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    volumes:
      - ./data:/opt/data
      - ./custom-skills:/opt/custom-skills:ro
    env_file:
      - .env
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
